name: CI/CD Deploy to EC2

# develop 브랜치에 push 될 때마다 실행
on:
  push:
    branches:
      - develop

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout source
        uses: actions/checkout@v3

      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 캐시 (빌드 속도 향상을 위해 캐시 사용)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 빌드 & 테스트 (CI 단계)
      - name: Build and Test with Gradle
        run: ./gradlew clean test --no-daemon

      # 5. Docker Hub 로그인 (Docker 이미지 푸시를 위해 필요)
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 & 푸시 (CD 단계 시작)
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mokakbob:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mokakbob:latest

      # 7. EC2에 SSH 접속해서 배포 (CD 단계)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mokakbob:latest
            docker stop mokakbob || true
            docker rm mokakbob || true
            
            export SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            export SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            export SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            export REDIS_HOST=${{ secrets.REDIS_HOST }}
            export REDIS_PORT=${{ secrets.REDIS_PORT }}
            export MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            export MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            export OAUTH_GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
            export OAUTH_GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
            export KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            docker run -d --name mokakbob -p 8080:8080 \
              --env SPRING_DATASOURCE_URL \
              --env SPRING_DATASOURCE_USERNAME \
              --env SPRING_DATASOURCE_PASSWORD \
              --env REDIS_HOST \
              --env REDIS_PORT \
              --env MAIL_USERNAME \
              --env MAIL_PASSWORD \
              --env OAUTH_GITHUB_CLIENT_ID \
              --env OAUTH_GITHUB_CLIENT_SECRET \
              --env KAFKA_BOOTSTRAP_SERVERS \
              --env JWT_SECRET \
              ${{ secrets.DOCKERHUB_USERNAME }}/mokakbob:latest
