name: CI/CD Deploy to EC2 (Blue/Green with Tag + Rollback)

on:
  push:
    tags:
      - 'v*'   # v로 시작하는 태그가 push될 때 실행 (예: v1.0.0)

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout source
        uses: actions/checkout@v3

      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 빌드 & 테스트
      - name: Build and Test with Gradle
        run: ./gradlew clean test --no-daemon

      # 5. Docker Hub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 & 푸시 (Git 태그 버전 사용)
      - name: Build and Push Docker image
        run: |
          VERSION=${{ github.ref_name }}
          echo "▶ Building Docker image with tag: $VERSION"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mokakbob:$VERSION .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mokakbob:$VERSION

      # 7. EC2에 배포 (헬스체크 + 실패 시 롤백, Blue/Green)
      - name: Deploy to EC2 (Blue/Green with Tag + Rollback)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            VERSION=${{ github.ref_name }}
            DOCKER_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/mokakbob:$VERSION"

            # 현재 돌고 있는 게 blue인지 green인지 확인
            if docker ps --format '{{.Names}}' | grep -q mokakbob-blue; then
              NEW_NAME="mokakbob-green"
              NEW_PORT=8081
              OLD_NAME="mokakbob-blue"
            else
              NEW_NAME="mokakbob-blue"
              NEW_PORT=8082
              OLD_NAME="mokakbob-green"
            fi

            echo "▶ Deploying $NEW_NAME on port $NEW_PORT with image $DOCKER_IMAGE"

            docker pull $DOCKER_IMAGE

            docker stop $NEW_NAME || true
            docker rm $NEW_NAME || true
            
            docker run -d --name $NEW_NAME -p $NEW_PORT:8080 \
            --network mokakbob-net \
            -e "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" \
            -e "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
            -e "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
            -e "REDIS_HOST=${{ secrets.REDIS_HOST }}" \
            -e "REDIS_PORT=${{ secrets.REDIS_PORT }}" \
            -e "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" \
            -e "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" \
            -e "OAUTH_GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}" \
            -e "OAUTH_GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}" \
            -e "KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" \
            -e "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            $DOCKER_IMAGE

            echo "▶ Waiting for health check on $NEW_NAME ($NEW_PORT)..."
            HEALTH_URL="http://localhost:$NEW_PORT/actuator/health"
            for i in {1..18}; do   # 10초씩, 최대 180초
              CODE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
              if [ "$CODE" -eq 200 ]; then
                echo "Health check passed at attempt $i"
                break
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done

            if [ "$CODE" -ne 200 ]; then
              echo "⚠ Health check failed after 180s, rolling back..."
              docker stop $NEW_NAME || true
              docker rm $NEW_NAME || true
              exit 1
            fi

            echo "▶ Switching traffic to $NEW_NAME"
            docker stop $OLD_NAME || true
            docker rm $OLD_NAME || true

            docker image prune -f
