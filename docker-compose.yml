version: "3.9"

services:
  # Redis
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--bind", "0.0.0.0", "--appendonly", "yes", "--protected-mode", "no"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Zookeeper (Kafka 의존)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: always
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/kafka/9092"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Spring Boot Application 1
  app1:
    image: eclipse-temurin:17-jdk
    container_name: app-8080
    volumes:
      - ./mokakbob-api/build/libs:/app
    working_dir: /app
    command: ["java", "-jar", "mokakbob-api-0.0.1-SNAPSHOT.jar", "--spring.profiles.active=local"]
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8080
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  # Spring Boot Application 2
  app2:
    image: eclipse-temurin:17-jdk
    container_name: app-8081
    volumes:
      - ./mokakbob-api/build/libs:/app
    working_dir: /app
    command: ["java", "-jar", "mokakbob-api-0.0.1-SNAPSHOT.jar", "--spring.profiles.active=local", "--server.port=8081"]
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8081
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  # Spring Boot Application 3
  app3:
    image: eclipse-temurin:17-jdk
    container_name: app-8082
    volumes:
      - ./mokakbob-api/build/libs:/app
    working_dir: /app
    command: ["java", "-jar", "mokakbob-api-0.0.1-SNAPSHOT.jar", "--spring.profiles.active=local", "--server.port=8082"]
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8082
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - app1
      - app2
      - app3
    restart: always

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

volumes:
  redis-data:

networks:
  default:
    name: monitoring-network
    driver: bridge
