global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'mokakbob-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'app-8080:8080'
          - 'app-8081:8081'
          - 'app-8082:8082'

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
