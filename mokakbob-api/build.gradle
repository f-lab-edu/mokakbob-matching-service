plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation project(':mokakbob-core')
    implementation project(':mokakbob-consumer')
    implementation project(':mokakbob-redis')

    // mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.retry:spring-retry'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.redisson:redisson-spring-boot-starter:3.27.2'

    // jwt
    implementation("io.jsonwebtoken:jjwt-api:0.11.5")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.11.5")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.11.5")

    // passwordEnc
    implementation 'org.springframework.security:spring-security-crypto'

    // s3
    implementation 'software.amazon.awssdk:s3:2.25.11'

    // oauth2 security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'software.amazon.msk:aws-msk-iam-auth:1.1.9'

    // websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // iamport
    implementation 'com.github.iamport:iamport-rest-client-java:0.2.23'
}

springBoot {
    mainClass = 'com.mokakbob.MokakbobApiApplication'
}
