plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    implementation project(':mokakbob-core')
    implementation project(':mokakbob-redis')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'software.amazon.msk:aws-msk-iam-auth:1.1.9'

    // redisson
    implementation 'org.redisson:redisson-spring-boot-starter:3.27.2'

    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}

springBoot {
    mainClass = 'com.mokakbob.matching.MokakbobConsumerApplication'
}

// 라이브러리로서 클래스 참조를 허용하기 위해 설정 추가
bootJar {
    enabled = true
}

jar {
    enabled = true
}
